# Appears at the top of the reports
serenity.project.name = Lab05 WebFTP Test Automation

# Disable auto-download; we manage the driver manually
webdriver.autodownload = false

# Use Chrome browser (matching user's Chrome 147.x)
webdriver.driver = chrome
headless.mode = false
# Path to ChromeDriver 147 — download from:
# https://googlechromelabs.github.io/chrome-for-testing/
# Pick the "Stable" chromedriver-win32.zip, unzip, rename to chromedriver.exe
webdriver.chrome.driver = src/test/resources/windows/chromedriver.exe

# Firefox driver (optional fallback)
webdriver.firefox.driver = src/test/resources/windows/geckodriver.exe

# Root package for JUnit acceptance tests
serenity.test.root=webFTP.features
